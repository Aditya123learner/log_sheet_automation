[project]
name = "log_sheet_automation"
authors = [
    { name = "Logic Motive Consultant", email = "erpnext@logic-motive.com" }
]
description = "Daily crane log-sheet automation for Sanghvi Movers: capture, OCR, client approval, parallel Maintenance + SAP validation, Operations sign-off and Billing handoff."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # `requests` ships with every Frappe bench already, listed here for clarity.
    "requests",
    # Only needed if OCR Provider Mode = "Google Document AI" (signs a JWT and
    # exchanges it for an OAuth2 access token from the service account key
    # stored in Log Sheet Automation Settings). Not needed for Mock or Azure.
    "google-auth",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# bench reads this to check compatibility before `bench get-app` / `install-app`
# / `migrate` will proceed — without it bench refuses the app entirely with
# "could not find a compatible Frappe version in pyproject.toml". This app was
# built and tested against Frappe/ERPNext v15; it links to ERPNext's own
# "Customer" DocType (see hooks.py's required_apps), so erpnext is a real
# dependency here, not just frappe.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.bench.dev-dependencies]
# none beyond the dependencies above

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
